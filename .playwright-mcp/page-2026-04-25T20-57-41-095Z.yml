            - generic [ref=e704]:
              - generic [ref=e705]: Alternating Floor Press
              - generic [ref=e706]: Acuéstate en el suelo con dos pesas rusas junto a los hombros. Coloca primero una sobre el pecho y luego la otra, tomándolas del asa con las palmas hacia adelante. Extiende ambos brazos para que las pesas queden por encima del pecho. Baja una pesa al pecho girando la muñeca hacia el lado de la pesa que queda extendida. Sube la pesa y repite con el otro lado.
            - generic [ref=e707]:
