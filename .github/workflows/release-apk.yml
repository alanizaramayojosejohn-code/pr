name: Release APK

# Compila y firma el APK de la app Flutter, publica el GitHub Release,
# actualiza public/app-version.json y redespliega la landing/PWA.
#
# Equivalente en CI de scripts/release-apk.ps1.
#
# Antes de correrlo: bumpeá `version:` en mobile/pubspec.yaml (ej. 1.2.0+3)
# y commiteá ese cambio. La versión sale de ahí.
#
# Secrets necesarios (Settings › Secrets and variables › Actions):
#   ANDROID_KEYSTORE_BASE64    → base64 -w0 pr-release.jks
#   ANDROID_KEYSTORE_PASSWORD  → storePassword de la keystore
#   ANDROID_KEY_ALIAS          → alias de la key (ej. pr)
#   ANDROID_KEY_PASSWORD       → password de la key
#   FIREBASE_SERVICE_ACCOUNT_PR_APP_EFA2F → ya existe, lo usa el deploy

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Notas de la versión (una por línea, con •)"
        required: true
        type: string
      min_supported_build:
        description: "min_supported_build — vacío mantiene el actual. Subilo SOLO ante un cambio incompatible."
        required: false
        type: string
      overwrite:
        description: "Reemplazar el release si el tag ya existe"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verificar que estén los secrets de firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_B64" ]   || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]      || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ]   || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Faltan secrets:$missing"
            echo "Sin la keystore el APK se firmaría con la clave debug y las" \
                 "instalaciones existentes no podrían actualizarse."
            exit 1
          fi

      - name: Leer versión de pubspec.yaml
        id: version
        run: |
          line=$(grep -m1 -E '^version:' mobile/pubspec.yaml)
          if ! [[ "$line" =~ ^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+) ]]; then
            echo "::error::No pude parsear la versión de mobile/pubspec.yaml: '$line'"
            exit 1
          fi
          name="${BASH_REMATCH[1]}"
          code="${BASH_REMATCH[2]}"
          echo "name=$name"   >> "$GITHUB_OUTPUT"
          echo "code=$code"   >> "$GITHUB_OUTPUT"
          echo "tag=v$name"   >> "$GITHUB_OUTPUT"
          echo "apk=pr-$name.apk" >> "$GITHUB_OUTPUT"
          echo "Versión: $name+$code"

      - name: Chequear que el tag esté libre
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          OVERWRITE: ${{ inputs.overwrite }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$OVERWRITE" != "true" ]; then
              echo "::error::El release $TAG ya existe. Bumpeá la versión en" \
                   "mobile/pubspec.yaml, o volvé a correr con overwrite=true."
              exit 1
            fi
            echo "Borrando release y tag previos de $TAG (overwrite=true)"
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restaurar keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          jks=mobile/android/app/pr-release.jks

          # Normalizo lo que suele romper un secret pegado a mano: espacios y
          # CRLF, alfabeto base64url (-_ en vez de +/), y padding faltante.
          clean=$(printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | tr -- '-_' '+/')
          clean=${clean%%=*}
          case $(( ${#clean} % 4 )) in
            2) clean="$clean==" ;;
            3) clean="$clean=" ;;
          esac

          invalid=$(printf '%s' "$clean" | tr -d 'A-Za-z0-9+/=' | wc -c)
          echo "Secret: ${#clean} caracteres tras normalizar, $invalid fuera del alfabeto base64."

          if ! printf '%s' "$clean" | base64 -d > "$jks" 2>/dev/null; then
            echo "Decodificado estricto falló; reintento ignorando caracteres sueltos."
            printf '%s' "$clean" | base64 -di > "$jks" 2>/dev/null || true
          fi

          # Una keystore JKS arranca con 0xFEEDFEED; una PKCS12, con una
          # SEQUENCE DER (0x3082). Si no es ninguna, lo que hay en el secret
          # no es el archivo que esperamos.
          magic=$(head -c 4 "$jks" 2>/dev/null | od -An -tx1 | tr -d ' \n')
          echo "Decodificado: $(stat -c%s "$jks" 2>/dev/null || echo 0) bytes, empieza con 0x${magic:-vacío}"
          case "$magic" in
            feedfeed*|3082*) ;;
            *)
              echo "::error::ANDROID_KEYSTORE_BASE64 no contiene una keystore."
              if printf '%s' "$KEYSTORE_B64" | grep -q 'BEGIN'; then
                echo "Trae encabezados '-----BEGIN...-----' — eso lo genera 'certutil -encode'."
              fi
              echo "Regeneralo en PowerShell, parado en la carpeta de la keystore:"
              echo '  [Convert]::ToBase64String([IO.File]::ReadAllBytes("pr-release.jks")) | Set-Clipboard'
              echo "y pegá el contenido del portapapeles como valor del secret, sin comillas."
              exit 1
              ;;
          esac

          # Que sea una keystore de verdad, y que la password y el alias abran.
          # Sin esto el error aparecería recién dentro de Gradle, minutos después.
          if ! keytool -list -keystore "$jks" -storepass "$STORE_PASSWORD" \
                 -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::No pude abrir la keystore con esos secrets."
            echo "Revisá que ANDROID_KEYSTORE_PASSWORD y ANDROID_KEY_ALIAS sean" \
                 "los de pr-release.jks, y que el base64 esté completo" \
                 "($(stat -c%s "$jks") bytes decodificados)."
            exit 1
          fi
          echo "Keystore OK ($(stat -c%s "$jks") bytes), alias '$KEY_ALIAS' encontrado."

          # key.properties lo lee el rootProject (mobile/android); storeFile se
          # resuelve relativo a mobile/android/app.
          cat > mobile/android/key.properties <<EOF
          storeFile=pr-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build APK firmado
        working-directory: mobile
        run: |
          # gradle.properties fija org.gradle.java.home al JBR de Android Studio
          # en Windows. En el runner ese path no existe y Gradle aborta, así que
          # lo saco y dejo que tome el JAVA_HOME del job (Temurin 21).
          sed -i '/^org\.gradle\.java\.home=/d' android/gradle.properties
          flutter pub get
          flutter build apk --release

      - name: Verificar firma del APK
        working-directory: mobile
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Huella de la keystore vs. huella con la que quedó firmado el APK.
          # keytool imprime hex en mayúsculas separado por ':'; apksigner lo
          # imprime plano en minúsculas — normalizo los dos antes de comparar.
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::warning::apksigner no encontrado en el runner; salteo la verificación de firma."
            exit 0
          fi
          expected=$(keytool -list -v -keystore android/app/pr-release.jks \
            -alias "$KEY_ALIAS" -storepass "$STORE_PASSWORD" 2>/dev/null \
            | awk '/SHA256:/ {print $2; exit}' | tr -d ':' | tr 'A-Z' 'a-z')
          actual=$("$apksigner" verify --print-certs \
            build/app/outputs/flutter-apk/app-release.apk \
            | awk -F': ' '/SHA-256 digest:/ {print $2; exit}' | tr -d ':' | tr 'A-Z' 'a-z')
          echo "keystore: $expected"
          echo "apk     : $actual"
          if [ -z "$expected" ] || [ -z "$actual" ] || [ "$expected" != "$actual" ]; then
            echo "::error::El APK no quedó firmado con la keystore de release."
            exit 1
          fi

      - name: Renombrar APK y calcular hash
        id: apk
        env:
          APK_NAME: ${{ steps.version.outputs.apk }}
        run: |
          src=mobile/build/app/outputs/flutter-apk/app-release.apk
          cp "$src" "mobile/build/app/outputs/flutter-apk/$APK_NAME"
          sha=$(sha256sum "$src" | cut -d' ' -f1)
          size=$(awk "BEGIN {printf \"%.1f\", $(stat -c%s "$src") / 1048576}")
          echo "path=mobile/build/app/outputs/flutter-apk/$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "size_mb=$size" >> "$GITHUB_OUTPUT"
          echo "SHA-256: $sha — $size MB"

      - name: Publicar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          NAME: ${{ steps.version.outputs.name }}
          NOTES: ${{ inputs.notes }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          gh release create "$TAG" "$APK_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --title "PR v$NAME" \
            --notes "$NOTES" \
            --latest

      - name: Actualizar public/app-version.json
        env:
          NAME: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
          TAG: ${{ steps.version.outputs.tag }}
          APK_NAME: ${{ steps.version.outputs.apk }}
          SHA: ${{ steps.apk.outputs.sha256 }}
          SIZE_MB: ${{ steps.apk.outputs.size_mb }}
          NOTES: ${{ inputs.notes }}
          MIN_SUPPORTED: ${{ inputs.min_supported_build }}
        run: |
          min="$MIN_SUPPORTED"
          if [ -z "$min" ]; then
            min=$(jq -r '.min_supported_build' public/app-version.json)
          fi
          if ! [[ "$min" =~ ^[0-9]+$ ]]; then
            echo "::error::min_supported_build inválido: '$min'"
            exit 1
          fi
          if [ "$min" -gt "$CODE" ]; then
            echo "::error::min_supported_build ($min) no puede superar el build actual ($CODE)."
            exit 1
          fi
          jq -n \
            --arg  version "$NAME" \
            --argjson build "$CODE" \
            --argjson min "$min" \
            --arg  url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$APK_NAME" \
            --argjson size "$SIZE_MB" \
            --arg  sha "$SHA" \
            --arg  notes "$NOTES" \
            --arg  date "$(date -u +%Y-%m-%d)" \
            '{
              latest_version: $version,
              latest_build: $build,
              min_supported_build: $min,
              apk_url: $url,
              apk_size_mb: $size,
              sha256: $sha,
              release_notes_es: $notes,
              released_at: $date
            }' > public/app-version.json
          cat public/app-version.json

      - name: Commitear el manifest
        env:
          NAME: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app-version.json
          if git diff --cached --quiet; then
            echo "Sin cambios en el manifest."
            exit 0
          fi
          git commit -m "chore: release v$NAME+$CODE"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Build de la PWA
        run: npm ci && npm run build

      # Un push hecho con GITHUB_TOKEN no dispara otros workflows, así que el
      # deploy de hosting va acá mismo en vez de delegarlo a firebase-hosting-merge.
      - name: Deploy a Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PR_APP_EFA2F }}
          channelId: live
          projectId: pr-app-efa2f

      - name: Limpiar secretos del runner
        if: always()
        run: rm -f mobile/android/app/pr-release.jks mobile/android/key.properties

      - name: Resumen
        env:
          NAME: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
          TAG: ${{ steps.version.outputs.tag }}
          APK_NAME: ${{ steps.version.outputs.apk }}
          SHA: ${{ steps.apk.outputs.sha256 }}
          SIZE_MB: ${{ steps.apk.outputs.size_mb }}
        run: |
          {
            echo "## PR v$NAME+$CODE publicada"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| APK | [$APK_NAME](https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$APK_NAME) |"
            echo "| Tamaño | $SIZE_MB MB |"
            echo "| SHA-256 | \`$SHA\` |"
            echo "| Manifest | https://pr-app-efa2f.web.app/app-version.json |"
          } >> "$GITHUB_STEP_SUMMARY"
